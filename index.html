  <style>
    :root {
      --green-deep: #1F5B5E;
      --green-darker: #0F3A3D;
      --green-ink: #0A2A2C;
      --gold: #B8923E;

      --line-soft: rgba(107, 66, 38, 0.10);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Heebo', 'Assistant', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16.5px;
      font-weight: 300;
      line-height: 1.7;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body { overflow-x: hidden; }

    h1, h2, h3, h4, .serif {
      font-family: 'Heebo', 'Assistant', sans-serif;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--green-ink);
      line-height: 1.18;
    }
    p { font-weight: 300; line-height: 1.75; }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--cream-warm); }
    ::-webkit-scrollbar-thumb { background: var(--gold-light); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* Utility */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px;
    }
    @media (max-width: 768px) {
      .container { padding: 0 20px; }
      html, body { font-size: 16px; }
    }

    /* Scroll reveals */
    .reveal {
      opacity: 0;
      transform: translateY(36px);
      transition: opacity 800ms var(--ease), transform 800ms var(--ease), filter 1000ms var(--ease);
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-blur {
      opacity: 0;
      filter: blur(14px);
      transform: translateY(24px) scale(1.02);
      transition: opacity 1100ms var(--ease), filter 1300ms var(--ease), transform 1100ms var(--ease);
    }
    .reveal-blur.in {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }
    .word-reveal { display: inline-block; overflow: hidden; vertical-align: top; }
    .word-reveal > span {
      display: inline-block;
      transform: translateY(110%);
      opacity: 0;
      transition: transform 800ms var(--ease), opacity 800ms var(--ease);
    }
    .word-reveal.in > span {
      transform: translateY(0);
      opacity: 1;
    }

    /* Gold divider */
    .gold-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 auto;
    }
    .gold-divider::before,
    .gold-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    }
    .gold-divider .diamond {
      width: 8px; height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    /* Buttons — quiet, museum-style */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 28px;
      border-radius: 0;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.08em;
      transition: all 280ms var(--ease);
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--green-ink);
      color: var(--cream);
    }
    .btn-primary:hover {
      background: var(--gold);
      color: #fff;
    }
    .btn-outline {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(250, 246, 239, 0.65);
    }
    .btn-outline:hover {
      border-color: var(--cream);
      background: rgba(250, 246, 239, 0.08);
    }
    .btn-ghost {
      background: transparent;
      color: var(--green-ink);
      border: 1px solid rgba(10, 42, 44, 0.4);
    }
    .btn-ghost:hover {
      border-color: var(--green-ink);
      background: rgba(10, 42, 44, 0.04);
    }
    /* Underline link */
    .link-underline {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      letter-spacing: 0.08em;
      font-weight: 400;
      padding: 4px 0;
    }
    .link-underline::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform-origin: right;
      transition: transform 400ms var(--ease);
    }
    .link-underline:hover::after { transform: scaleX(0.4); }

    /* Arabesque arches pattern border */
    .arch-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }
    .arch {
      width: 16px;
      height: 18px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    /* Card — flat, museum */
    .card {
      background: #fff;
      border-radius: 0;
      border: 1px solid var(--line-soft);
      overflow: hidden;
      transition: border-color 400ms var(--ease), transform 600ms var(--ease);
    }
    .card:hover {
      border-color: rgba(184, 146, 62, 0.5);
    }

    /* Eyebrow */
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.32em;
      font-weight: 400;
      color: var(--gold);
      text-transform: uppercase;
    }

    /* Page transitions */
    .page-fade {
      animation: pageFadeIn 600ms var(--ease);
    }
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loader */
    #app-loader {
      position: fixed;
      inset: 0;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 400ms ease;
    }
    #app-loader.hidden { opacity: 0; pointer-events: none; }
    #app-loader .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--gold-soft);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Selection */
    ::selection { background: var(--gold); color: #fff; }

    /* Ken Burns slow zoom — for cinematic hero images */
    @keyframes kenBurnsZoom {
      0%   { transform: scale(1.05); }
      100% { transform: scale(1.18); }
    }
    .ken-burns {
      animation: kenBurnsZoom 16s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
      will-change: transform;
    }

    /* Hero content reveal — shared by parasha list & detail heroes */
    @keyframes parashaHeroFade {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
